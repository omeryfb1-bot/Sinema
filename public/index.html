<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sinema Odası</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
    #playerFrame { width: 100%; height: 600px; border: 2px solid #333; margin-top: 10px; }
    input { padding: 10px; width: 60%; }
    button { padding: 10px 15px; cursor: pointer; }
    .result-item { background: #222; padding: 10px; margin: 5px 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Ortak Film & Arama Odası</h2>

  <!-- URL Yapıştırma veya Arama Kutusu -->

    <input type="text" id="searchInput" placeholder="Film adı ara veya direkt site URL'si yapıştır...">
    <button onclick="filmAraVeyaAc()">Aç / Ara</button>
  </div>

  <!-- Arama Sonuçlarının Listeleneceği Alan -->
  <div id="searchResults"></div>

  <!-- Filmin / Sitenin Açılacağı Ekran -->
  <iframe id="playerFrame" src="about:blank"></iframe>

  <script src="b.js"></script>
</body>
</html>
